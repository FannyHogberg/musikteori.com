<body>
    <header>
        <nav class="navbar">
            <a href="../index.html" class="logo">Musikteori.com</a>
            <a href="../../ovningar/piano-tangenter-ova.html" class="lang-switch" title="Svenska">SV</a>
            <button class="menu-toggle" aria-label="Open menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../courses.html">Courses</a></li>
                <li><a href="../exercises.html" class="active">Exercises</a></li>
                <li><a href="../quiz.html">Quiz</a></li>
                <li><a href="../contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="piano-exercise">
            <div class="exercise-header">
                <h1>Practice the Piano Keys</h1>
                <p class="subtitle">Level <span id="level-number">1</span> of 13</p>
                <p class="level-description" id="level-description-text"></p>
            </div>

            <div class="question" id="question">
                Where is <span id="note-to-find">C</span>?
            </div>

            <div class="feedback-message" id="feedback-message"></div>

            <div class="landscape-tip">
                Tip: Turn your device to landscape mode for the best experience
            </div>

            <div class="piano">
                <div class="piano-keys" id="piano-keys">
                    <!-- Piano keys will be generated by JavaScript -->
                </div>
            </div>

            <div class="note-buttons" id="note-buttons">
                <!-- Buttons generated dynamically by JS -->
            </div>

            <div class="stats">
                <div class="stat-box">
                    <div class="stat-label">Correct</div>
                    <div class="stat-value" id="correct-count">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Wrong</div>
                    <div class="stat-value" id="incorrect-count">0</div>
                </div>
            </div>

            <div class="controls">
                <button class="btn" id="back-to-hub-btn">&larr; Change exercise</button>
            </div>
        </div>
    </main>
