<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:title" content="Öva tonerna på pianot">
    <meta property="og:description" content="Interaktiv övning där du lär dig pianots tangenter. Öva stamtoner, korsförtecken och b-förtecken steg för steg.">
    <meta property="og:image" content="https://musikteori.com/images/og-image.jpg">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://musikteori.com/ovningar/piano-tangenter-ova.html">

    <link rel="stylesheet" href="../css/style.css">
    <style>
        .piano-exercise {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }

        .exercise-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .exercise-header h1 {
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #666;
            font-size: 1rem;
            margin: 0.25rem 0;
        }

        .level-info {
            background: var(--background-alt);
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 2rem;
            text-align: center;
        }

        .question {
            font-size: 2.5rem;
            font-weight: bold;
            text-align: center;
            margin: 0 0 2rem 0;
            color: var(--primary-color);
        }

        .note-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 1.5rem;
            margin-bottom: 1.5rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            min-height: 80px;
        }

        .note-buttons.disabled {
            opacity: 0.6;
            pointer-events: none;
        }

        .note-buttons:empty,
        .note-buttons[style*="display: none"] {
            visibility: hidden;
        }

        .note-button {
            min-width: 80px;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            font-weight: bold;
            background: white;
            border: 2px solid #333;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        @media (hover: hover) {
            .note-button:hover {
                background: var(--primary-light);
                border-color: var(--primary-color);
            }
        }

        .note-button.correct {
            background: #a8e6cf;
            border-color: var(--primary-color);
        }

        .note-button.incorrect {
            background: #ffb3ba;
            border-color: #e74c3c;
        }

        .feedback-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-size: 3rem;
            font-weight: bold;
            z-index: 1000;
            pointer-events: none;
            margin: 0;
            padding: 0;
        }

        .feedback-message.show-correct,
        .feedback-message.show-incorrect {
            padding: 1.5rem 3rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            color: white;
        }

        .feedback-message.show-correct {
            background: #27ae60;
            animation: feedbackPop 0.6s ease-out;
        }

        .feedback-message.show-incorrect {
            background: #e74c3c;
            animation: feedbackShake 0.6s ease-out;
        }

        .piano {
            position: relative;
            height: 200px;
            background: #f5f5f5;
            border-radius: 10px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 0;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
        }

        .piano-keys {
            position: relative;
            display: flex;
            gap: 2px;
        }

        .piano-keys.disabled {
            opacity: 0.6;
            pointer-events: none;
        }

        .piano-keys.no-interaction .white-key,
        .piano-keys.no-interaction .black-key {
            cursor: default;
            pointer-events: none;
        }

        .piano-keys.no-interaction .white-key:hover,
        .piano-keys.no-interaction .black-key:hover {
            background: white;
        }

        .piano-keys.no-interaction .black-key:hover {
            background: #333;
        }

        .piano-keys.no-interaction .white-key:active,
        .piano-keys.no-interaction .black-key:active {
            transform: none;
        }

        .white-key {
            width: 50px;
            height: 180px;
            background: white;
            border: 2px solid #333;
            border-radius: 0 0 5px 5px;
            cursor: pointer;
            position: relative;
            transition: all 0.1s;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
            font-weight: bold;
            color: #666;
        }

        @media (hover: hover) {
            .white-key:hover {
                background: #f0f0f0;
            }
        }

        .white-key:active {
            background: #e0e0e0;
            transform: translateY(2px);
        }

        .white-key.correct {
            background: #a8e6cf;
            animation: correctPulse 0.5s;
        }

        .white-key.incorrect {
            background: #ffb3ba;
            animation: shake 0.3s;
        }

        .black-key {
            width: 35px;
            height: 110px;
            background: #333;
            border: 2px solid #000;
            border-radius: 0 0 3px 3px;
            cursor: pointer;
            position: absolute;
            z-index: 10;
            transition: all 0.1s;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 5px;
            font-weight: bold;
            color: #999;
            font-size: 0.85rem;
        }

        @media (hover: hover) {
            .black-key:hover {
                background: #444;
            }
        }

        .black-key:active {
            background: #555;
            transform: translateY(2px);
        }

        .black-key.correct {
            background: #70d69f;
        }

        .black-key.incorrect {
            background: #ff8a8a;
        }

        .hide-labels .key-label {
            display: none;
        }

        .hide-black-labels .black-key .key-label {
            display: none;
        }

        .white-key.highlighted {
            background: var(--primary-color) !important;
            animation: pulse 1s infinite;
        }

        .black-key.highlighted {
            background: var(--primary-color) !important;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                background: var(--primary-color) !important;
            }
            50% {
                background: var(--primary-dark) !important;
            }
        }

        .level-description {
            color: #666;
            font-size: 0.95rem;
            margin-top: 0.5rem;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin: 2rem 0;
            gap: 1rem;
        }

        .stat-box {
            background: white;
            padding: 1rem;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            flex: 1;
            text-align: center;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
        }

        .controls {
            text-align: center;
            margin-top: 2rem;
        }

        @keyframes correctPulse {
            0% { transform: scale(1); }
            30% { transform: scale(1.1); }
            60% { transform: scale(0.95); }
            100% { transform: scale(1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-8px); }
            20%, 40%, 60%, 80% { transform: translateX(8px); }
        }

        @keyframes feedbackPop {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 0;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        @keyframes feedbackShake {
            0% {
                transform: translate(-50%, -50%) scale(0.5) rotate(0deg);
                opacity: 0;
            }
            25% {
                transform: translate(-50%, -50%) scale(1.1) rotate(-5deg);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.1) rotate(5deg);
                opacity: 1;
            }
            75% {
                transform: translate(-50%, -50%) scale(1.05) rotate(-3deg);
            }
            100% {
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .level-complete {
            background: var(--primary-light);
            padding: 2rem;
            border-radius: 10px;
            text-align: center;
            margin: 2rem 0;
        }

        .level-complete h2 {
            color: var(--primary-dark);
            margin-bottom: 0.75rem;
            font-size: 1.75rem;
        }

        .level-complete p {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            color: #000;
            font-weight: 600;
        }

        .level-complete .btn {
            margin: 0.5rem;
        }

        .landscape-tip {
            display: none;
            background: #fff3cd;
            color: #856404;
            padding: 0.75rem;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            border: 1px solid #ffeaa7;
        }

        /* Responsiv design för mobil */
        @media (max-width: 768px) {
            .landscape-tip {
                display: block;
            }
            .piano-exercise {
                padding: 1rem;
            }

            .question {
                font-size: 2rem;
            }

            .piano {
                padding: 15px 10px;
            }

            .white-key {
                width: 44px;
                min-width: 44px;
                height: 160px;
                font-size: 0.8rem;
            }

            .black-key {
                width: 32px;
                min-width: 32px;
                height: 100px;
                font-size: 0.7rem;
            }

            .note-button {
                min-width: 70px;
                padding: 0.6rem 0.75rem;
                font-size: 0.85rem;
            }

            .stats {
                gap: 0.5rem;
            }

            .stat-box {
                padding: 0.75rem;
            }

            .stat-label {
                font-size: 0.8rem;
            }

            .stat-value {
                font-size: 1.2rem;
            }
        }

        @media (max-width: 480px) {
            .piano-exercise {
                padding: 0.5rem;
            }

            .question {
                font-size: 1.5rem;
            }

            .piano {
                padding: 10px 5px;
            }

            .white-key {
                width: 40px;
                min-width: 40px;
                height: 140px;
                font-size: 0.7rem;
                padding-bottom: 8px;
            }

            .black-key {
                width: 28px;
                min-width: 28px;
                height: 85px;
                font-size: 0.65rem;
                padding-bottom: 4px;
            }

            .note-button {
                min-width: 60px;
                padding: 0.5rem 0.6rem;
                font-size: 0.8rem;
            }

            .level-info {
                padding: 0.75rem;
                margin-bottom: 0.75rem;
            }

            .stats {
                flex-direction: column;
                gap: 0.5rem;
            }

            .stat-box {
                padding: 0.5rem;
            }
        }

        /* Dölj landscape-tips när enheten är i landscape */
        @media (max-width: 768px) and (orientation: landscape) {
            .landscape-tip {
                display: none;
            }
        }
    </style>
</head>
