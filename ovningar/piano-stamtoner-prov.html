<head>

    <style>
        .piano-exercise {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }

        .exercise-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .exercise-header h1 {
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #666;
            font-size: 1rem;
            margin: 0.25rem 0;
        }

        .question {
            font-size: 2.5rem;
            font-weight: bold;
            text-align: center;
            margin: 0 0 2rem 0;
            color: var(--primary-color);
        }

        .piano {
            position: relative;
            height: 200px;
            background: #f5f5f5;
            border-radius: 10px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 0;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
        }

        .piano-keys {
            position: relative;
            display: flex;
            gap: 2px;
        }

        .piano-keys.disabled {
            opacity: 0.6;
            pointer-events: none;
        }

        .white-key {
            width: 50px;
            height: 180px;
            background: white;
            border: 2px solid #333;
            border-radius: 0 0 5px 5px;
            cursor: pointer;
            position: relative;
            transition: all 0.1s;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 10px;
            font-weight: bold;
            color: #666;
        }

        .white-key:hover {
            background: #f0f0f0;
        }

        .white-key:active {
            background: #e0e0e0;
            transform: translateY(2px);
        }

        .black-key {
            width: 35px;
            height: 110px;
            background: #333;
            border: 2px solid #000;
            border-radius: 0 0 3px 3px;
            cursor: pointer;
            position: absolute;
            z-index: 10;
            transition: all 0.1s;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 5px;
            font-weight: bold;
            color: #999;
            font-size: 0.85rem;
        }

        .black-key:hover {
            background: #444;
        }

        .black-key:active {
            background: #555;
            transform: translateY(2px);
        }

        .hide-labels .key-label {
            display: none;
        }

        .hide-black-labels .black-key .key-label {
            display: none;
        }

        .white-key.highlighted {
            background: var(--primary-color) !important;
            animation: pulse 1s infinite;
        }

        .black-key.highlighted {
            background: var(--primary-color) !important;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                background: var(--primary-color) !important;
            }
            50% {
                background: var(--primary-dark) !important;
            }
        }

        .note-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 1.5rem;
            margin-bottom: 1.5rem;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            min-height: 80px;
        }

        .note-buttons.disabled {
            opacity: 0.6;
            pointer-events: none;
        }

        @keyframes buttonShuffle {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(-10px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .note-button {
            min-width: 80px;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            font-weight: bold;
            background: white;
            border: 2px solid #333;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            animation: buttonShuffle 0.3s ease-out;
        }

        .note-button:hover {
            background: var(--primary-light);
            border-color: var(--primary-color);
        }

        .piano-keys.no-interaction .white-key,
        .piano-keys.no-interaction .black-key {
            cursor: default;
            pointer-events: none;
        }

        .piano-keys.no-interaction .white-key:hover {
            background: white;
        }

        .piano-keys.no-interaction .black-key:hover {
            background: #333;
        }

        .piano-keys.no-interaction .white-key:active,
        .piano-keys.no-interaction .black-key:active {
            transform: none;
        }

        /* Responsiv design för mobil */
        @media (max-width: 768px) {
            .piano-exercise {
                padding: 1rem;
            }

            .question {
                font-size: 2rem;
            }

            .piano {
                padding: 15px 10px;
            }

            .white-key {
                width: 44px;
                min-width: 44px;
                height: 160px;
                font-size: 0.8rem;
            }

            .black-key {
                width: 32px;
                min-width: 32px;
                height: 100px;
                font-size: 0.7rem;
            }
        }

        @media (max-width: 480px) {
            .piano-exercise {
                padding: 0.5rem;
            }

            .question {
                font-size: 1.5rem;
            }

            .piano {
                padding: 10px 5px;
            }

            .white-key {
                width: 40px;
                min-width: 40px;
                height: 140px;
                font-size: 0.7rem;
                padding-bottom: 8px;
            }

            .black-key {
                width: 28px;
                min-width: 28px;
                height: 85px;
                font-size: 0.65rem;
                padding-bottom: 4px;
            }
        }

        .question-counter {
            background: var(--background-alt);
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            display: inline-block;
            font-weight: 600;
            color: #333;
            margin-bottom: 1.5rem;
        }

        @keyframes questionUpdate {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
                background: #e8f5e9;
            }
            100% {
                transform: scale(1);
            }
        }

        .question-counter.updated {
            animation: questionUpdate 0.4s ease-out;
        }
    </style>
</head>

        <nav class="navbar">

            </div>

            <div style="text-align: center; margin-bottom: 1.5rem;">
