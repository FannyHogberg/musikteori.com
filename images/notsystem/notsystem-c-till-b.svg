<svg width="600" height="220" viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg">
  <!-- 5 notlinjer -->
  <g stroke="#999" stroke-width="1.5">
    <line x1="30" y1="60" x2="570" y2="60"/>
    <line x1="30" y1="75" x2="570" y2="75"/>
    <line x1="30" y1="90" x2="570" y2="90"/>
    <line x1="30" y1="105" x2="570" y2="105"/>
    <line x1="30" y1="120" x2="570" y2="120"/>
  </g>


  <!-- C: under notsystemet, på hjälplinje (y=135) -->
  <line x1="135" y1="135" x2="165" y2="135" stroke="#999" stroke-width="1.5"/>
  <ellipse cx="150" cy="135" rx="10" ry="7.5" fill="#2c3e50" transform="rotate(-15, 150, 135)"/>
  <line x1="159" y1="135" x2="159" y2="90" stroke="#2c3e50" stroke-width="2.5"/>

  <!-- D: under linje 1 (y=127.5) -->
  <ellipse cx="210" cy="127.5" rx="10" ry="7.5" fill="#2c3e50" transform="rotate(-15, 210, 127.5)"/>
  <line x1="219" y1="127.5" x2="219" y2="82.5" stroke="#2c3e50" stroke-width="2.5"/>

  <!-- E: på linje 1 (y=120) -->
  <ellipse cx="270" cy="120" rx="10" ry="7.5" fill="#2c3e50" transform="rotate(-15, 270, 120)"/>
  <line x1="279" y1="120" x2="279" y2="75" stroke="#2c3e50" stroke-width="2.5"/>

  <!-- F: mellan linje 1 och 2 (y=112.5) -->
  <ellipse cx="330" cy="112.5" rx="10" ry="7.5" fill="#2c3e50" transform="rotate(-15, 330, 112.5)"/>
  <line x1="339" y1="112.5" x2="339" y2="67.5" stroke="#2c3e50" stroke-width="2.5"/>

  <!-- G: på linje 2 (y=105) -->
  <ellipse cx="390" cy="105" rx="10" ry="7.5" fill="#2c3e50" transform="rotate(-15, 390, 105)"/>
  <line x1="399" y1="105" x2="399" y2="60" stroke="#2c3e50" stroke-width="2.5"/>

  <!-- A: mellan linje 2 och 3 (y=97.5) -->
  <ellipse cx="450" cy="97.5" rx="10" ry="7.5" fill="#2c3e50" transform="rotate(-15, 450, 97.5)"/>
  <line x1="459" y1="97.5" x2="459" y2="52.5" stroke="#2c3e50" stroke-width="2.5"/>

  <!-- B: på linje 3 (y=90) -->
  <ellipse cx="510" cy="90" rx="10" ry="7.5" fill="#2c3e50" transform="rotate(-15, 510, 90)"/>
  <line x1="519" y1="90" x2="519" y2="45" stroke="#2c3e50" stroke-width="2.5"/>

  <!-- Bokstavsetiketter under varje not -->
  <g font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2ecc71" text-anchor="middle">
    <text x="150" y="165">C</text>
    <text x="210" y="165">D</text>
    <text x="270" y="165">E</text>
    <text x="330" y="165">F</text>
    <text x="390" y="165">G</text>
    <text x="450" y="165">A</text>
    <text x="510" y="165">B</text>
  </g>
</svg>
