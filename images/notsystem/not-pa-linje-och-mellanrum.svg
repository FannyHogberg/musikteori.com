<svg width="500" height="200" viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 5 notlinjer -->
  <g stroke="#999" stroke-width="1.5">
    <line x1="30" y1="50" x2="470" y2="50"/>
    <line x1="30" y1="65" x2="470" y2="65"/>
    <line x1="30" y1="80" x2="470" y2="80"/>
    <line x1="30" y1="95" x2="470" y2="95"/>
    <line x1="30" y1="110" x2="470" y2="110"/>
  </g>

  <!-- Avdelare i mitten -->
  <line x1="250" y1="42" x2="250" y2="118" stroke="#ddd" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Vänster: Not PÅ linje 3 -->
  <ellipse cx="140" cy="80" rx="13" ry="9" fill="#2c3e50" transform="rotate(-15, 140, 80)"/>
  <!-- Skaft -->
  <line x1="152" y1="80" x2="152" y2="42" stroke="#2c3e50" stroke-width="2.5"/>

  <!-- Etikett -->
  <text x="140" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2ecc71" text-anchor="middle">PÅ linjen</text>
  <text x="140" y="162" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">(linjen går genom noten)</text>

  <!-- Höger: Not MELLAN linje 2 och 3 -->
  <ellipse cx="360" cy="87.5" rx="13" ry="9" fill="#2c3e50" transform="rotate(-15, 360, 87.5)"/>
  <!-- Skaft -->
  <line x1="372" y1="87.5" x2="372" y2="49.5" stroke="#2c3e50" stroke-width="2.5"/>

  <!-- Etikett -->
  <text x="360" y="145" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e67e22" text-anchor="middle">MELLAN linjerna</text>
  <text x="360" y="162" font-family="Arial, sans-serif" font-size="12" fill="#666" text-anchor="middle">(noten sitter i mellanrummet)</text>
</svg>
