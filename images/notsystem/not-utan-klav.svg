<svg width="300" height="130" viewBox="0 0 300 130" xmlns="http://www.w3.org/2000/svg">
  <!-- 5 notlinjer -->
  <g stroke="#555" stroke-width="1.5">
    <line x1="30" y1="25" x2="270" y2="25"/>
    <line x1="30" y1="40" x2="270" y2="40"/>
    <line x1="30" y1="55" x2="270" y2="55"/>
    <line x1="30" y1="70" x2="270" y2="70"/>
    <line x1="30" y1="85" x2="270" y2="85"/>
  </g>

  <!-- Nothuvud på mittenlinjen (linje 3, y=55) -->
  <ellipse cx="150" cy="55" rx="10" ry="7.5" fill="black" transform="rotate(-10, 150, 55)"/>

  <!-- Skaft uppåt -->
  <line x1="159" y1="55" x2="159" y2="18" stroke="black" stroke-width="2.5"/>

  <!-- Frågetecken -->
  <text x="150" y="115" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#e74c3c" text-anchor="middle">?</text>
</svg>
