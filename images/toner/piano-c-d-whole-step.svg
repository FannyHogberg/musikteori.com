<svg width="560" height="320" viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">En helton mellan C och D</title>
  <desc id="description">Piano med C, Ciss (C♯) och D markerade i grönt. En V-formad markering under pianot pekar på C och D. Ciss är tangenten mellan dem, och avståndet från C till D är en helton.</desc>
