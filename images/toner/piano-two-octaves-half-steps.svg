<svg width="700" height="300" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Halvtoner mellan E och F och mellan B och C</title>
  <desc id="description">Två oktaver på pianot med namngivna vita tangenter. V-formade pilar under pianot markerar E–F i båda oktaverna och B–C mellan oktaverna. Varje markerat avstånd är en halvton, utan någon svart tangent emellan.</desc>

  <g transform="translate(0, 20)">
    <!-- White keys (14 keys = 2 octaves) -->
    <g fill="white" stroke="black" stroke-width="2">
      <!-- Octave 1 -->
      <rect x="0" y="0" width="50" height="200"/>
      <rect x="50" y="0" width="50" height="200"/>
      <rect x="100" y="0" width="50" height="200"/>
      <rect x="150" y="0" width="50" height="200"/>
      <rect x="200" y="0" width="50" height="200"/>
      <rect x="250" y="0" width="50" height="200"/>
      <rect x="300" y="0" width="50" height="200"/>
      <!-- Octave 2 -->
      <rect x="350" y="0" width="50" height="200"/>
      <rect x="400" y="0" width="50" height="200"/>
      <rect x="450" y="0" width="50" height="200"/>
      <rect x="500" y="0" width="50" height="200"/>
      <rect x="550" y="0" width="50" height="200"/>
      <rect x="600" y="0" width="50" height="200"/>
      <rect x="650" y="0" width="50" height="200"/>
    </g>

    <!-- Black keys -->
    <g fill="black">
      <!-- Octave 1: group of 2 -->
      <rect x="35" y="0" width="30" height="120"/>
      <rect x="85" y="0" width="30" height="120"/>
      <!-- Octave 1: group of 3 -->
      <rect x="185" y="0" width="30" height="120"/>
      <rect x="235" y="0" width="30" height="120"/>
      <rect x="285" y="0" width="30" height="120"/>
      <!-- Octave 2: group of 2 -->
      <rect x="385" y="0" width="30" height="120"/>
      <rect x="435" y="0" width="30" height="120"/>
      <!-- Octave 2: group of 3 -->
      <rect x="535" y="0" width="30" height="120"/>
      <rect x="585" y="0" width="30" height="120"/>
      <rect x="635" y="0" width="30" height="120"/>
    </g>

    <!-- V-formade pilar från under pianot till respektive tangent. -->
    <g fill="none" stroke="#176b48" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 125,207 L 150,265 L 175,207 M 122,218 L 125,207 L 135,213 M 165,213 L 175,207 L 178,218"/>
      <path d="M 325,207 L 350,265 L 375,207 M 322,218 L 325,207 L 335,213 M 365,213 L 375,207 L 378,218"/>
      <path d="M 475,207 L 500,265 L 525,207 M 472,218 L 475,207 L 485,213 M 515,213 L 525,207 L 528,218"/>
    </g>

    <!-- Labels for each white key -->
    <g font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2ecc71" text-anchor="middle">
      <!-- Octave 1 -->
      <text x="25" y="185">C</text>
      <text x="75" y="185">D</text>
      <text x="125" y="185">E</text>
      <text x="175" y="185">F</text>
      <text x="225" y="185">G</text>
      <text x="275" y="185">A</text>
      <text x="325" y="185">B</text>
      <!-- Octave 2 -->
      <text x="375" y="185">C</text>
      <text x="425" y="185">D</text>
      <text x="475" y="185">E</text>
      <text x="525" y="185">F</text>
      <text x="575" y="185">G</text>
      <text x="625" y="185">A</text>
      <text x="675" y="185">B</text>
    </g>
  </g>

</svg>
