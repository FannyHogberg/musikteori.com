<svg width="1400" height="290" viewBox="0 0 1400 290" xmlns="http://www.w3.org/2000/svg">
  <!-- C markers above keys -->
  <g font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e74c3c" text-anchor="middle">
    <text x="25" y="15">C</text>
    <text x="375" y="15">C</text>
    <text x="725" y="15">C</text>
    <text x="1075" y="15">C</text>
  </g>

  <!-- White keys (28 = 4 octaves) -->
  <g fill="white" stroke="black" stroke-width="2">
    <!-- Great octave -->
    <rect x="0" y="25" width="50" height="200"/>
    <rect x="50" y="25" width="50" height="200"/>
    <rect x="100" y="25" width="50" height="200"/>
    <rect x="150" y="25" width="50" height="200"/>
    <rect x="200" y="25" width="50" height="200"/>
    <rect x="250" y="25" width="50" height="200"/>
    <rect x="300" y="25" width="50" height="200"/>
    <!-- Small octave -->
    <rect x="350" y="25" width="50" height="200"/>
    <rect x="400" y="25" width="50" height="200"/>
    <rect x="450" y="25" width="50" height="200"/>
    <rect x="500" y="25" width="50" height="200"/>
    <rect x="550" y="25" width="50" height="200"/>
    <rect x="600" y="25" width="50" height="200"/>
    <rect x="650" y="25" width="50" height="200"/>
    <!-- One-line octave -->
    <rect x="700" y="25" width="50" height="200"/>
    <rect x="750" y="25" width="50" height="200"/>
    <rect x="800" y="25" width="50" height="200"/>
    <rect x="850" y="25" width="50" height="200"/>
    <rect x="900" y="25" width="50" height="200"/>
    <rect x="950" y="25" width="50" height="200"/>
    <rect x="1000" y="25" width="50" height="200"/>
    <!-- Two-line octave -->
    <rect x="1050" y="25" width="50" height="200"/>
    <rect x="1100" y="25" width="50" height="200"/>
    <rect x="1150" y="25" width="50" height="200"/>
    <rect x="1200" y="25" width="50" height="200"/>
    <rect x="1250" y="25" width="50" height="200"/>
    <rect x="1300" y="25" width="50" height="200"/>
    <rect x="1350" y="25" width="50" height="200"/>
  </g>

  <!-- Black keys (5 per octave x 4 = 20) -->
  <g fill="black">
    <!-- Great octave -->
    <rect x="35" y="25" width="30" height="120"/>
    <rect x="85" y="25" width="30" height="120"/>
    <rect x="185" y="25" width="30" height="120"/>
    <rect x="235" y="25" width="30" height="120"/>
    <rect x="285" y="25" width="30" height="120"/>
    <!-- Small octave -->
    <rect x="385" y="25" width="30" height="120"/>
    <rect x="435" y="25" width="30" height="120"/>
    <rect x="535" y="25" width="30" height="120"/>
    <rect x="585" y="25" width="30" height="120"/>
    <rect x="635" y="25" width="30" height="120"/>
    <!-- One-line octave -->
    <rect x="735" y="25" width="30" height="120"/>
    <rect x="785" y="25" width="30" height="120"/>
    <rect x="885" y="25" width="30" height="120"/>
    <rect x="935" y="25" width="30" height="120"/>
    <rect x="985" y="25" width="30" height="120"/>
    <!-- Two-line octave -->
    <rect x="1085" y="25" width="30" height="120"/>
    <rect x="1135" y="25" width="30" height="120"/>
    <rect x="1235" y="25" width="30" height="120"/>
    <rect x="1285" y="25" width="30" height="120"/>
    <rect x="1335" y="25" width="30" height="120"/>
  </g>

  <!-- Octave brackets -->
  <g stroke="#2ecc71" stroke-width="3" fill="none">
    <path d="M 0 240 L 0 255 L 350 255 L 350 240" stroke-linecap="round"/>
    <path d="M 350 240 L 350 255 L 700 255 L 700 240" stroke-linecap="round"/>
    <path d="M 700 240 L 700 255 L 1050 255 L 1050 240" stroke-linecap="round"/>
    <path d="M 1050 240 L 1050 255 L 1400 255 L 1400 240" stroke-linecap="round"/>
  </g>

  <!-- Octave names -->
  <g font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2ecc71" text-anchor="middle">
    <text x="175" y="280">Great octave</text>
    <text x="525" y="280">Small octave</text>
    <text x="875" y="280">One-line octave</text>
    <text x="1225" y="280">Two-line octave</text>
  </g>
</svg>
