<svg width="500" height="260" viewBox="0 0 500 260" xmlns="http://www.w3.org/2000/svg">
  <!-- 5 staff lines -->
  <g stroke="#999" stroke-width="1.5">
    <line x1="40" y1="80" x2="460" y2="80"/>
    <line x1="40" y1="95" x2="460" y2="95"/>
    <line x1="40" y1="110" x2="460" y2="110"/>
    <line x1="40" y1="125" x2="460" y2="125"/>
    <line x1="40" y1="140" x2="460" y2="140"/>
  </g>


  <!-- Note BELOW staff: C (one ledger line) -->
  <line x1="135" y1="155" x2="165" y2="155" stroke="#999" stroke-width="1.5"/>
  <ellipse cx="150" cy="155" rx="10" ry="7.5" fill="#2c3e50" transform="rotate(-15, 150, 155)"/>
  <line x1="159" y1="155" x2="159" y2="110" stroke="#2c3e50" stroke-width="2.5"/>

  <!-- Note BELOW staff: small A (two ledger lines) -->
  <line x1="225" y1="155" x2="255" y2="155" stroke="#999" stroke-width="1.5"/>
  <line x1="225" y1="170" x2="255" y2="170" stroke="#999" stroke-width="1.5"/>
  <ellipse cx="240" cy="170" rx="10" ry="7.5" fill="#2c3e50" transform="rotate(-15, 240, 170)"/>
  <line x1="249" y1="170" x2="249" y2="125" stroke="#2c3e50" stroke-width="2.5"/>

  <!-- Note ABOVE staff: two-line C (one ledger line) -->
  <line x1="325" y1="65" x2="355" y2="65" stroke="#999" stroke-width="1.5"/>
  <ellipse cx="340" cy="65" rx="10" ry="7.5" fill="#2c3e50" transform="rotate(-15, 340, 65)"/>
  <line x1="331" y1="65" x2="331" y2="110" stroke="#2c3e50" stroke-width="2.5"/>

  <!-- Note ABOVE staff: two-line D (one ledger line, in space above) -->
  <line x1="405" y1="65" x2="435" y2="65" stroke="#999" stroke-width="1.5"/>
  <ellipse cx="420" cy="57.5" rx="10" ry="7.5" fill="#2c3e50" transform="rotate(-15, 420, 57.5)"/>
  <line x1="411" y1="57.5" x2="411" y2="102.5" stroke="#2c3e50" stroke-width="2.5"/>

  <!-- Label "Ledger lines" with arrows -->
  <g font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2ecc71">
    <text x="190" y="205">&#x2191; Ledger lines</text>
    <text x="325" y="42">Ledger lines &#x2193;</text>
  </g>
</svg>
