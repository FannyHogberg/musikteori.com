<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120">
  <!-- Notlinjer -->
  <g stroke="#999" stroke-width="1">
    <line x1="20" y1="30" x2="180" y2="30"/>
    <line x1="20" y1="45" x2="180" y2="45"/>
    <line x1="20" y1="60" x2="180" y2="60"/>
    <line x1="20" y1="75" x2="180" y2="75"/>
    <line x1="20" y1="90" x2="180" y2="90"/>
  </g>

  <!-- Trettiotvåondelsnot - fylld oval med skaft och tre flaggor -->
  <ellipse cx="100" cy="75" rx="12" ry="9" fill="#2c3e50" transform="rotate(-15, 100, 75)"/>
  <!-- Skaft -->
  <line x1="111" y1="72" x2="111" y2="20" stroke="#2c3e50" stroke-width="3"/>
  <!-- Flagga 1 -->
  <path d="M111 20 Q125 30 118 42" fill="none" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
  <!-- Flagga 2 -->
  <path d="M111 30 Q125 40 118 52" fill="none" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
  <!-- Flagga 3 -->
  <path d="M111 40 Q125 50 118 62" fill="none" stroke="#2c3e50" stroke-width="3" stroke-linecap="round"/>
</svg>
